name: Move major tag

# Consumers pin the action to a major tag such as `v0`, so every published
# release moves that tag to the release's commit. Breaking changes go to the
# next major tag.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Move the major tag to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a vX.Y.Z release: $RELEASE_TAG"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
          fi
          echo "Moved $major to $RELEASE_TAG ($sha)"
