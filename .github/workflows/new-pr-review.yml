name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Same-repository pull requests only: the review runs this pull request's
    # own version of the action, which must never happen for fork code.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Specialists (up to 15m) run before the main review (up to 25m).
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bonk
        # The local action, so every pull request is reviewed by the code it
        # changes.
        uses: ./github
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/claude-opus-5-5
          forks: "false"
          permissions: write
          token_permissions: NO_PUSH
          rereview_context: "true"
          timeout: 25m
          specialist_timeout: 15m
