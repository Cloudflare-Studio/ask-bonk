name: Review

on:
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # mentions in this check must match the `mentions` input below
    if: github.event.sender.type != 'Bot' && contains(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Verify PR exists
        id: verify-pr
        run: |
          if gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::PR #${{ github.event.pull_request.number }} not found, skipping review"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        if: steps.verify-pr.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        if: steps.verify-pr.outputs.exists == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.verify-pr.outputs.exists == 'true'
        run: bun install --frozen-lockfile

      - name: Run Bonk
        if: steps.verify-pr.outputs.exists == 'true'
        uses: ask-bonk/ask-bonk/github@main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # Auto-approve tool calls in CI only, so Bonk doesn't get stuck on
          # approval prompts. This is intentionally not in opencode.jsonc so
          # local/interactive sessions keep their normal permission prompts.
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":"allow","provider":{"cloudflare-ai-gateway":{"models":{"workers-ai/@cf/zai-org/glm-5.2":{"reasoning":true,"tool_call":true,"temperature":true,"limit":{"context":262144,"output":262144}}}}}}
        with:
          model: cloudflare-ai-gateway/workers-ai/@cf/zai-org/glm-5.2
          mentions: "/review"
          permissions: write
          agent: reviewer
          prompt: |
            Review this pull request for discrete, actionable defects introduced by the change.
            Inspect the diff, relevant surrounding code, and applicable repository instructions.
            Ignore non-blocking style preferences and speculative concerns. Report every qualifying finding in severity order.
