name: "Bonk GitHub Action"
description: "Run Bonk (Pi) in GitHub Actions workflows"
branding:
  icon: "git-pull-request"
  color: "orange"

inputs:
  model:
    description: "Model to use (e.g., opencode/claude-opus-4-5)"
    required: true

  agent:
    description: "Named agent prompt from .pi/agents/<name>.md (legacy .opencode/agents paths also work)"
    required: false

  prompt:
    description: "Task prompt for scheduled/dispatch runs, or an override for the triggering request"
    required: false

  mentions:
    description: "Comma-separated trigger phrases (e.g., '/bonk,@ask-bonk')"
    required: false
    default: "/bonk,@ask-bonk"

  permissions:
    description: "Required permission level: 'admin', 'write', 'any', or 'CODEOWNERS' (checks .github/CODEOWNERS)"
    required: false
    default: "write"

  oidc_base_url:
    description: "Base URL for OIDC token exchange"
    required: false
    default: "https://ask-bonk.silverlock.workers.dev/auth"

  forks:
    description: "Post a 'not supported' comment on fork PRs. Set to 'false' to silently skip fork PRs."
    required: false
    default: "true"

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  token_permissions:
    description: "Scope the installation token: 'NO_PUSH' (can comment but not push), 'WRITE' (default), or a JSON permissions object"
    required: false

  pi_version:
    description: "Pin to a specific Pi coding agent version (e.g., '0.83.0'). Falls back to 'latest' on invalid input."
    required: false
    default: "latest"

  opencode_version:
    description: "Deprecated compatibility input. Accepted but ignored."
    required: false
    default: "latest"

  opencode_dev:
    description: "Deprecated compatibility input. Accepted but ignored."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check mentions
      id: mentions
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        REVIEW_BODY: ${{ github.event.review.body }}
        MENTIONS: ${{ inputs.mentions }}
      run: |
        BODY=""

        case "$EVENT_NAME" in
          issue_comment|pull_request_review_comment)
            BODY="$COMMENT_BODY"
            ;;
          pull_request_review)
            BODY="$REVIEW_BODY"
            ;;
          issues|pull_request|workflow_dispatch|schedule)
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
            ;;
          *)
            echo "Unsupported event type: $EVENT_NAME"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
            ;;
        esac

        IFS=',' read -ra MENTION_ARRAY <<< "$MENTIONS"

        for mention in "${MENTION_ARRAY[@]}"; do
          mention="${mention#"${mention%%[![:space:]]*}"}"
          mention="${mention%"${mention##*[![:space:]]}"}"
          if [[ "$BODY" == *"$mention"* ]]; then
            echo "Found mention: $mention"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        done

        echo "No matching mention found in comment"
        echo "skip=true" >> $GITHUB_OUTPUT

    - name: Setup bun
      if: success() && steps.mentions.outputs.skip != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3"

    - name: "Prepare: validate and structure request"
      if: success() && steps.mentions.outputs.skip != 'true'
      id: preflight
      shell: bash
      env:
        # permissions
        REQUIRED_PERMISSION: ${{ inputs.permissions }}
        COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        REVIEW_ACTOR: ${{ github.event.review.user.login }}
        # setup + track
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_NAME: ${{ github.event_name }}
        # version
        GH_TOKEN: ${{ github.token }}
        PI_VERSION: ${{ inputs.pi_version }}
        # prompt
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.pull_request.url && github.event.issue.number || github.event.pull_request.number || '' }}
        PR_URL: ${{ github.event.pull_request.url || github.event.issue.pull_request.url || '' }}
        USER_PROMPT: ${{ inputs.prompt }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        REVIEW_BODY: ${{ github.event.review.body }}
        MENTIONS: ${{ inputs.mentions }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # fork-comment
        FORKS: ${{ inputs.forks }}
        ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.actor }}
        # track
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        ISSUE_CREATED_AT: ${{ github.event.issue.created_at || github.event.pull_request.created_at }}
        # token scoping
        TOKEN_PERMISSIONS: ${{ inputs.token_permissions }}
      run: bun run ${{ github.action_path }}/script/orchestrate.ts

    - name: "Prepare: install Pi"
      if: success() && steps.mentions.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        PI_VERSION: ${{ steps.preflight.outputs.pi_version }}
      run: |
        set -euo pipefail
        bun install -g --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"
        echo "Pi version: $(pi --version 2>/dev/null || echo 'unknown')"

    - name: "Prepare: authoritative worktree"
      if: |
        success() && steps.mentions.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        && (steps.preflight.outputs.is_fork != 'true' || steps.preflight.outputs.run_pi == 'true')
      id: worktree
      shell: bash
      env:
        GH_TOKEN: ${{ steps.preflight.outputs.gh_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        PR_NUMBER: ${{ github.event.issue.pull_request.url && github.event.issue.number || github.event.pull_request.number || '' }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.preflight.outputs.head_sha }}
      run: bun run ${{ github.action_path }}/script/prepare-worktree.ts

    - name: "Run: Pi"
      if: |
        success() && steps.mentions.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        && (steps.preflight.outputs.is_fork != 'true' || steps.preflight.outputs.run_pi == 'true')
      id: pi
      shell: bash
      run: bun run ${{ github.action_path }}/script/run-pi.ts
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        VARIANT: ${{ inputs.variant }}
        PROMPT: ${{ steps.preflight.outputs.value }}
        BONK_GUIDANCE_PATH: ${{ github.action_path }}/bonk_guidance.md
        BONK_ACTION_PATH: ${{ github.action_path }}
        BONK_RESULT_PATH: ${{ runner.temp }}/bonk-result-${{ github.run_id }}.json
        IS_FORK: ${{ steps.preflight.outputs.is_fork }}
        RUN_MODE: ${{ steps.preflight.outputs.mode }}

    - name: "Finalize: publish Bonk result"
      if: |
        always() && steps.preflight.outcome == 'success' && steps.mentions.outputs.skip != 'true'
        && steps.preflight.outputs.skip != 'true'
        && (steps.preflight.outputs.is_fork != 'true' || steps.preflight.outputs.run_pi == 'true')
      shell: bash
      env:
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PI_STATUS: ${{ steps.pi.outcome }}
        GH_TOKEN: ${{ steps.preflight.outputs.gh_token }}
        BONK_RESULT_PATH: ${{ runner.temp }}/bonk-result-${{ github.run_id }}.json
        RUN_MODE: ${{ steps.preflight.outputs.mode }}
        INITIAL_SHA: ${{ steps.worktree.outputs.base_sha }}
        LOCAL_BRANCH: ${{ steps.worktree.outputs.branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_NUMBER: ${{ github.event.issue.pull_request.url && github.event.issue.number || github.event.pull_request.number || '' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.preflight.outputs.head_sha }}
        # Pass issue/PR context so the server can post failure comments even
        # when the run was never tracked or was already removed from activeRuns.
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: bun run ${{ github.action_path }}/script/finalize.ts

    - name: Cleanup Git credentials
      if: always() && steps.mentions.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        server_url="${GITHUB_SERVER_URL:-https://github.com}"
        host="${server_url#https://}"
        host="${host#http://}"
        git config --unset-all "http.${server_url}/.extraheader" 2>/dev/null || true
        git config --local --unset-all "credential.helper" 2>/dev/null || true
        git remote set-url origin "https://${host}/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
